[package]
name = "volgit"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
colored = "3.1.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
libc = "0.2.189"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
