[package]
name = "volgit"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A fetch-style CLI for GitHub: repo cards, profiles, contribution graphs and side-by-side comparisons, right in your terminal"
repository = "https://github.com/KillKillaV/volgit"
readme = "README.md"
keywords = ["github", "cli", "terminal", "fetch", "git"]
categories = ["command-line-utilities"]
exclude = ["assets/"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
colored = "3.1.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
libc = "0.2.189"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
